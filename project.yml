name: LidarCapture
options:
  bundleIdPrefix: com.pilgrim12
  deploymentTarget:
    iOS: "16.0"
targets:
  LidarCapture:
    type: application
    platform: iOS
    sources: [Sources]
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pilgrim12.lidarcapture
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: LiDAR Capture
        NSCameraUsageDescription: "Камера и LiDAR нужны для записи скана"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arkit]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
